name: Publish Ovolar APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.0.0
        required: true
        type: string
      prerelease:
        description: Mark this as a prerelease
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run android:sync
      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Name distributable
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ovolar.apk
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
          files: ovolar.apk
